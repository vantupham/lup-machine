version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    groups:
      # Chỉ gộp các bản nâng nhỏ (minor / patch) của công cụ phát triển.
      # Bản nâng lớn (major) được tách thành PR riêng để xem xét từng cái.
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.x chỉ hỗ trợ TypeScript < 6.1. Bỏ dòng này khi typescript-eslint hỗ trợ TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
